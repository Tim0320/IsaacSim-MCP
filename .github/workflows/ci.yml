name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.1  # keep in sync with .pre-commit-config.yaml

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Install package and test dependencies
        run: python -m pip install -e . pytest

      - name: Unit tests
        run: >-
          pytest -q
          --ignore=tests/test_launcher_engine.py
          --ignore=tests/test_integration.py
          -k "not test_detect_version_returns_zero_on_failure"
