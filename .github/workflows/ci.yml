name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.1  # keep in sync with .pre-commit-config.yaml

      - name: Lint
        run: ruff check .

      - name: Format check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="${{ github.sha }}^"
            fi
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "$base...${{ github.sha }}" -- \
              '*.py' '*.pyi' '*.md'
          )
          if ((${#files[@]})); then
            ruff format --check "${files[@]}"
          else
            echo "No changed Python or Markdown files to format-check."
          fi

  python-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest "tomli>=2; python_version < '3.11'"
      - name: Unit, contract, and offline adapter tests
        run: pytest -q -m "not live and not windows_launcher and not unix_launcher" -k "not test_detect_version_returns_zero_on_failure"

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: PowerShell launcher tests
        run: pytest -q tests/test_run_isaac_sim_windows.py tests/test_backup_project_script.py

  linux-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Bash launcher tests
        run: pytest -q tests/test_launcher_engine.py

  generated-tool-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify generated tool inventory
        run: python scripts/generate_tool_inventory.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Clean wheel smoke install
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/isaacsim-mcp-wheel-smoke"
          "$RUNNER_TEMP/isaacsim-mcp-wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/isaacsim-mcp-wheel-smoke/bin/python" -c \
            "import importlib.metadata, isaac_mcp; assert importlib.metadata.version('isaacsim-mcp-server') == isaac_mcp.__version__"
